# SCIFORGE: replaces FreeCAD's PROBLEM_REPORT.yml (core-patches.md #16). The field ids below
# (what_happened, expected, steps, diagnostics, version, system, extra) are used by
# Help > Report a Problem to fill the form through the address; do not rename them without
# changing the dialog (docs/sciforge/dev/briefs/beta-release.md, R2).
name: Bug report
description: Something in SciForge does not work, looks wrong, or crashed.
title: "[Bug] "
labels: ["bug", "beta"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping. The easiest way to fill this in is **Help > Report a Problem**
        inside SciForge: it opens this form with the details already filled in (your name and
        folders are removed, and you can read everything before it goes anywhere).

        Before you write: the [known issues](https://github.com/Luca0422git/SciForge/blob/develop/docs/sciforge/known-issues.md)
        list may already explain it. Questions ("how do I...?") belong in
        [Discussions](https://github.com/Luca0422git/SciForge/discussions), not here.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Say what you did and what you saw, in your own words. A picture helps (drag it into this box).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      description: What should have happened? (If Fusion does it differently, tell us how.)
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat it
      description: "Numbered if you can: 1. New design 2. Create Sketch on the XY plane 3. ... Does it happen every time?"
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Paste the text from **SciForge > Diagnostics** or the text from **Help > Report a Problem**.
        It holds the version and the recent SciForge messages, which is what lets us find the
        cause. Please do not remove it.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SciForge version
      description: Shown quietly on the Home tab next to "Home", and in the first line of SciForge > Diagnostics.
      placeholder: 0.1.0-beta
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Something else (tell us below)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Your graphics card, the screen scaling (100 / 125 / 150 %), whether OneDrive or Google
        Drive backs up your Documents folder, your antivirus program. If SciForge saved a report
        file (Help > Report a Problem > Save report...) or a crash log, drag it into this box.
        Please do not attach a design you do not want to make public: everything on GitHub is
        public.
    validations:
      required: false
