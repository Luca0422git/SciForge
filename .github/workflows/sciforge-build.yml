# SPDX-License-Identifier: LGPL-2.1-or-later
# SciForge: full build of the fork (C++ and all), producing files Luca downloads and tests:
#   Windows: portable .7z (unzip anywhere, run bin\FreeCAD.exe)
#   Linux:   .AppImage
# Before compiling, quick checks (about 10 minutes): every SciForge file is installed, the
# unit tests, and the golden models on the official FreeCAD for Windows. A problem they can
# find must not cost hours of compiling first.
# After compiling, the build is uploaded first and then tested (golden models on the built
# SciForge): a failing test marks the run red but no longer throws the build away, since a
# Python problem is fixed by the quick update on top. The GUI scenarios then run on the
# built Linux AppImage in parallel (4 parts).
#
# Started by hand: GitHub > Actions > "SciForge build" > Run workflow. It is not run on
# every push because a build takes hours (free on this public repository, but slow).
# Pushing a tag named sciforge-v* also starts it.
#
# Packaging reuses FreeCAD's own pipeline (package/rattler-build). Until the branding
# pass lands, the Windows installer is not built: it would install as "FreeCAD" and could
# collide with a real FreeCAD installation. The portable .7z is self-contained.

name: SciForge build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        type: choice
        default: both
        options: [both, windows, linux]
  push:
    tags: ["sciforge-v*"]

# One build per branch and platform choice: a Windows-only build does not cancel a
# running build of both.
concurrency:
  group: sciforge-build-${{ github.ref }}-${{ github.event.inputs.platforms || 'both' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A minute before hours of compiling: every SciForge file must be in the install rules
  # (run #2 compiled for 4 hours and then lacked 81 of 116 SciForge modules).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Every SciForge file is installed by the build
        run: tools/sciforge/check_install.sh

      - name: Unit tests
        run: tools/sciforge/run_tests.sh --only unit --out test-output

  # The golden models on the official FreeCAD for Windows (about 10 minutes): run #3
  # compiled for 3 hours and then failed 2 golden models only Windows fails.
  check-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Cache FreeCAD for Windows
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sciforge-cache/freecad-windows
          key: freecad-windows-1.1.4

      - name: Golden models on FreeCAD for Windows
        env:
          FREECAD_VERSION: "1.1.4"
        run: bash tools/sciforge/windows_golden.sh --stock .sciforge-cache/freecad-windows test-output

      - name: Add golden report to the run summary
        if: always()
        run: |
          if [ -f test-output/golden-report.md ]; then cat test-output/golden-report.md >> "$GITHUB_STEP_SUMMARY"; fi

  matrix:
    needs: [check, check-windows]
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          CHOICE: ${{ github.event.inputs.platforms || 'both' }}
        run: |
          win='{"target":"win-64","os":"windows-2022"}'
          lin='{"target":"linux-64","os":"ubuntu-22.04"}'
          case "$CHOICE" in
            windows) echo "include=[$win]" >> "$GITHUB_OUTPUT" ;;
            linux) echo "include=[$lin]" >> "$GITHUB_OUTPUT" ;;
            *) echo "include=[$win,$lin]" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    steps:
      # Prevent running out of disk space on Ubuntu runners.
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-android: 'true'
          remove-cached-tools: 'true'

      - name: Use drive D for caches (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo 'PIXI_CACHE_DIR=D:\rattler' >> "$GITHUB_ENV"
          echo 'RATTLER_CACHE_DIR=D:\rattler' >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Build name
        shell: bash
        run: echo "BUILD_TAG=sciforge-$(date -u +%Y%m%d)-${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@82d477f15f3a381dbcc8adc1206ce643fe110fb7 # v0.9.3
        with:
          pixi-version: v0.59.0
          cache: false
          run-install: false

      - name: Compile SciForge (takes a long time)
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3 package/scripts/write_version_info.py ../freecad_version.txt
          cd package/rattler-build
          pixi install

      - name: Package
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.target }}
          MAKE_INSTALLER: "false"
          UPLOAD_RELEASE: "false"
        run: |
          set -euo pipefail
          cd package/rattler-build
          pixi run -e package create_bundle

      # ---- Linux: upload the built AppImage, then test it ----------------
      # Uploaded first: a failing test must not throw away an hour of compiling.
      # The scenarios (about 2 hours on one machine) run afterwards in the "scenarios" job.
      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: SciForge-Linux-${{ env.BUILD_TAG }}
          path: |
            package/rattler-build/linux/*.AppImage
            package/rattler-build/linux/*-SHA256.txt
          retention-days: 30
          compression-level: 0

      - name: Test the Linux build (unit, golden models, GUI smoke and journey)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          image=$(ls package/rattler-build/linux/*.AppImage | head -1)
          mkdir -p .sciforge-cache/sciforge
          (cd .sciforge-cache/sciforge && "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null)
          tools/sciforge/run_tests.sh --freecad .sciforge-cache/sciforge --out test-output --only base

      # ---- Windows: upload the portable build, then test it --------------
      # Uploaded first: a failing test must not throw away 3 hours of compiling (run #3).
      - name: Upload Windows portable build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: SciForge-Windows-portable-${{ env.BUILD_TAG }}
          path: |
            package/rattler-build/windows/*.7z
            package/rattler-build/windows/*-SHA256.txt
          retention-days: 30
          compression-level: 0

      - name: Test the Windows build (golden models)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tools/sciforge/windows_golden.sh --built package/rattler-build/windows test-output

      - name: Add golden report to the run summary
        if: always()
        shell: bash
        run: |
          if [ -f test-output/golden-report.md ]; then cat test-output/golden-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-output-${{ matrix.target }}
          path: test-output/
          retention-days: 30

  # The GUI scenarios on the built Linux AppImage, in 4 parts side by side. They test the
  # C++ fixes through the interface; the uploads above do not wait for them.
  scenarios:
    needs: [matrix, build]
    if: ${{ !cancelled() && contains(needs.matrix.outputs.include, 'linux-64') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Get the AppImage built above
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'SciForge-Linux-*' --dir built
          image=$(find built -name '*.AppImage' | head -1)
          chmod +x "$image"
          mkdir -p .sciforge-cache/sciforge
          (cd .sciforge-cache/sciforge && "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null)

      - name: Scenarios ${{ matrix.shard }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri
          tools/sciforge/run_tests.sh --freecad .sciforge-cache/sciforge --out test-output --only scenarios --shard ${{ matrix.shard }}

      - name: Name of the reports
        if: always()
        run: echo "PART=$(echo '${{ matrix.shard }}' | cut -d/ -f1)" >> "$GITHUB_ENV"

      - name: Upload scenario reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: scenarios-linux-${{ env.PART }}
          path: test-output/
          retention-days: 14
