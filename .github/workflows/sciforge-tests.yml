# SPDX-License-Identifier: LGPL-2.1-or-later
# SciForge: tests on every push and pull request (about 40 minutes).
# Runs SciForge's unit tests, the golden models and the GUI tests against
# the official FreeCAD release the fork is based on, with SciForge added as an
# add-on, on Linux; the golden models also on FreeCAD for Windows. No C++ build,
# so it stays cheap. Full builds: sciforge-build.yml.

name: SciForge tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sciforge-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FREECAD_VERSION: "1.1.4"

jobs:
  # The tests run side by side on 5 machines (one machine took about 2 hours): "base" runs
  # the unit tests, golden models, smoke test and journey; "1/4".."4/4" each run a quarter
  # of the GUI scenarios (tools/sciforge/run_tests.sh --shard).
  tests:
    name: tests (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: base
            args: --only base
            id: base
          - part: scenarios 1/4
            args: --only scenarios --shard 1/4
            id: scenarios-1
          - part: scenarios 2/4
            args: --only scenarios --shard 2/4
            id: scenarios-2
          - part: scenarios 3/4
            args: --only scenarios --shard 3/4
            id: scenarios-3
          - part: scenarios 4/4
            args: --only scenarios --shard 4/4
            id: scenarios-4
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Install virtual screen for the GUI test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri

      - name: Cache FreeCAD ${{ env.FREECAD_VERSION }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sciforge-cache/freecad
          key: freecad-appimage-${{ env.FREECAD_VERSION }}

      - name: Get FreeCAD ${{ env.FREECAD_VERSION }}
        run: tools/sciforge/get_freecad.sh .sciforge-cache/freecad

      # The full build installs SciForge with src/Mod/SciForge/CMakeLists.txt; a file left out
      # there only shows in a full build, hours later.
      - name: Every SciForge file is installed by the full build
        if: matrix.id == 'base'
        run: tools/sciforge/check_install.sh

      - name: Tests (${{ matrix.part }})
        run: tools/sciforge/run_tests.sh --freecad .sciforge-cache/freecad --out test-output ${{ matrix.args }}

      - name: Add golden report to the run summary
        if: always() && matrix.id == 'base'
        run: |
          if [ -f test-output/golden-report.md ]; then cat test-output/golden-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sciforge-test-output-${{ matrix.id }}
          path: test-output/
          retention-days: 14

  # The golden models on the official FreeCAD for Windows (Luca's system), SciForge added
  # as an add-on. Catches what only Windows does (2026-10-12: a number too big for
  # Windows' 32-bit C "long" failed every Shell Both; only a 3-hour Windows build saw it).
  windows:
    name: tests (Windows golden models)
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Cache FreeCAD ${{ env.FREECAD_VERSION }} for Windows
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sciforge-cache/freecad-windows
          key: freecad-windows-${{ env.FREECAD_VERSION }}

      - name: Golden models on FreeCAD for Windows
        run: bash tools/sciforge/windows_golden.sh --stock .sciforge-cache/freecad-windows test-output

      - name: Add golden report to the run summary
        if: always()
        run: |
          if [ -f test-output/golden-report.md ]; then cat test-output/golden-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sciforge-test-output-windows
          path: test-output/
          retention-days: 14

  # Packaged at once, without waiting for the tests (Luca 2026-10-19: "I need to be testing
  # asap"); the tests run beside it and report on their own.
  quick-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Package the quick update (SciForge module only, no rebuild needed)
        run: |
          mkdir -p quick-update
          cp -r src/Mod/SciForge quick-update/SciForge
          find quick-update -name __pycache__ -prune -exec rm -rf {} +
          printf 'COMMIT = "%s"\nDATE = "%s"\n' "${GITHUB_SHA::8}" "$(date -u +%Y-%m-%d)" \
            > quick-update/SciForge/sciforge/build_info.py
          cp tools/sciforge/install_update.ps1 tools/sciforge/install_update.cmd quick-update/
          cp docs/sciforge/quick-update.md quick-update/README.md

      - name: Upload the quick update
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: SciForge-quick-update-${{ github.sha }}
          path: quick-update/
          retention-days: 30
