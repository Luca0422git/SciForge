# SPDX-License-Identifier: LGPL-2.1-or-later
# SciForge: fast tests on every push and pull request (a few minutes, Linux only).
# Runs SciForge's unit tests, the golden models and the GUI smoke test against
# the official FreeCAD release the fork is based on, with SciForge added as an
# add-on. No C++ build, so it stays cheap. Full builds: sciforge-build.yml.

name: SciForge tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sciforge-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FREECAD_VERSION: "1.1.4"

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 1
          submodules: false

      - name: Install virtual screen for the GUI test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgl1-mesa-dri

      - name: Cache FreeCAD ${{ env.FREECAD_VERSION }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .sciforge-cache/freecad
          key: freecad-appimage-${{ env.FREECAD_VERSION }}

      - name: Get FreeCAD ${{ env.FREECAD_VERSION }}
        run: tools/sciforge/get_freecad.sh .sciforge-cache/freecad

      - name: Unit tests, golden models, GUI smoke test
        run: tools/sciforge/run_tests.sh --freecad .sciforge-cache/freecad --out test-output

      - name: Package the quick update (SciForge module only, no rebuild needed)
        if: success()
        run: |
          mkdir -p quick-update
          cp -r src/Mod/SciForge quick-update/SciForge
          find quick-update -name __pycache__ -prune -exec rm -rf {} +
          printf 'COMMIT = "%s"\nDATE = "%s"\n' "${GITHUB_SHA::8}" "$(date -u +%Y-%m-%d)" \
            > quick-update/SciForge/sciforge/build_info.py
          cp tools/sciforge/install_update.ps1 tools/sciforge/install_update.cmd quick-update/
          cp docs/sciforge/quick-update.md quick-update/README.md

      - name: Upload the quick update
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: SciForge-quick-update-${{ github.sha }}
          path: quick-update/
          retention-days: 30

      - name: Add golden report to the run summary
        if: always()
        run: |
          if [ -f test-output/golden-report.md ]; then cat test-output/golden-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload reports and screenshot
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sciforge-test-output
          path: test-output/
          retention-days: 14
